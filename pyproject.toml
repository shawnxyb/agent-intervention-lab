[project]
name = "manager-intervention-experiments"
version = "0.1.0"
description = "Linux environment for a Codex subscription based CooperBench supervision study"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docker>=7.1,<8",
  "requests>=2.32,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false
link-mode = "copy"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["vendor", ".tools", ".cache", "workspaces", "runs", "artifacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
